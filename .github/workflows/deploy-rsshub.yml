# ============================================================
# 工作流名称：自动部署 RSSHub 到 SAP BTP (Cloud Foundry)
# 触发方式：仅手动触发（Actions 页面点 Run workflow）
# 可选区域：SG(free) 新加坡 / US(free) 美国
#
# ------------------------------------------------------------
# 运行前，必须在仓库 Settings → Secrets and variables → Actions
# → Secrets 中配置以下变量（名字必须一字不差）：
#
#   【RSSHub 相关】
#   1) RSSHUB_ACCESS_KEY    必填。访问密钥，防止别人使用你的实例
#                           建议只用字母和数字（订阅地址里要带 ?key=密钥）
#
#   【SAP 登录，2 个必填】
#   2) EMAIL                SAP BTP 账号邮箱
#   3) PASSWORD             SAP BTP 账号密码
#
#   【可选】
#   - RSSHUB_PROXY_URI      出站代理，如 socks5h://地址:端口 或 http://地址:端口
#                           （订阅的网站拦截机房 IP 时使用）
#   - RSSHUB_CACHE_EXPIRE   路由缓存时间（秒），默认 1800
#   - RSSHUB_DOCKER_IMAGE   自定义镜像，默认 ghcr.io/diygod/rsshub:latest
#                           （注意：不要用 chromium-bundled 版本，太大，SAP 上起不来）
#   - RSSHUB_MEMORY / RSSHUB_DISK   内存与磁盘，默认 768M / 1G
#
# 说明：RSSHub 本身不需要数据库，配置全部是环境变量；
#       环境变量由 Cloud Foundry 保存，应用每天被平台停止再启动也不会丢。
# ============================================================
name: 自动部署RSSHub到SAP

on:
  workflow_dispatch:
    inputs:
      # ---------- 部署区域选择 ----------
      region:
        description: '选择部署区域'
        required: true
        default: 'SG(free)'
        type: choice
        options:
          - SG(free)    # Azure 新加坡
          - US(free)    # AWS 美国
      # ---------- 应用名称 ----------
      app_name:
        description: '应用名称（强烈建议固定填写，否则每次部署地址都会变，订阅要重新改）'
        required: false
        default: ''

# ---------- 全局环境变量（可用同名 Secret 覆盖） ----------
env:
  DOCKER_IMAGE: ${{ secrets.RSSHUB_DOCKER_IMAGE || 'ghcr.io/diygod/rsshub:latest' }}  # Docker 镜像地址
  MEMORY: ${{ secrets.RSSHUB_MEMORY || '768M' }}                                     # 应用内存
  DISK: ${{ secrets.RSSHUB_DISK || '1G' }}                                           # 应用磁盘

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
    # ---------- 步骤1：安装 Cloud Foundry 命令行工具 ----------
    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
        echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    # ---------- 步骤2：根据所选区域确定 API 地址和应用名 ----------
    - name: Determine CF API endpoint and app name
      run: |
        # 生成 6 位随机字母，用于自动生成应用名
        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

        # API = 区域代码（拼成 api.cf.<API>.hana.ondemand.com）
        # P   = 应用名前缀
        case "${{ github.event.inputs.region }}" in
          "SG(free)")  API=ap21;     P=rss-freesg ;;
          "US(free)")  API=us10-001; P=rss-freeus ;;
          *) echo "未知区域"; exit 1 ;;
        esac

        echo "CF_API=https://api.cf.${API}.hana.ondemand.com" >> $GITHUB_ENV

        # 默认用"前缀+随机串"；如果手动填写了应用名，则以填写的为准
        APP_NAME="${P}${RANDOM_STR}"
        if [ -n "${{ github.event.inputs.app_name }}" ]; then
          APP_NAME="${{ github.event.inputs.app_name }}"
        fi
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "应用名称: $APP_NAME"

    # ---------- 步骤3：检查必填 Secrets ----------
    # 放在登录和部署之前：配置不全就直接失败，不会在 SAP 上留下残留
    - name: Check secrets
      env:
        RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
      run: |
        if [ -z "$RSSHUB_ACCESS_KEY" ]; then
          echo "❌ 缺少 RSSHUB_ACCESS_KEY，请先在仓库 Secrets 中配置"
          exit 1
        fi
        echo "✅ 必填 Secrets 已配置"

    # ---------- 步骤4：查看镜像暴露的端口 ----------
    # RSSHub 通过环境变量 PORT 决定监听端口（默认 1200），
    # CF 会自动注入与路由一致的 PORT，所以这里只打印出来方便排查
    - name: Detect container port
      run: |
        docker pull "${{ env.DOCKER_IMAGE }}"
        PORT=$(docker image inspect "${{ env.DOCKER_IMAGE }}" \
          --format '{{range $p,$_ := .Config.ExposedPorts}}{{println $p}}{{end}}' \
          | head -1 | cut -d/ -f1)
        if [ -z "$PORT" ]; then
          echo "⚠️ 镜像未声明 EXPOSE，CF 将默认转发到 8080（应用会读取 CF 注入的 PORT）"
        else
          echo "镜像暴露端口: $PORT"
        fi

    # ---------- 步骤5：登录 Cloud Foundry ----------
    - name: Login to Cloud Foundry
      run: |
        # 第一次登录，用于获取组织和空间列表
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"

        # 取第一个组织和空间
        ORG=$(cf orgs | sed -n '4p')
        echo "ORG=$ORG" >> $GITHUB_ENV
        SPACE=$(cf spaces | sed -n '4p')
        echo "SPACE=$SPACE" >> $GITHUB_ENV

        # 指定组织和空间重新登录
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

    # ---------- 步骤6：部署应用 ----------
    - name: Deploy application
      env:
        RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}        # 访问密钥（必填）
        RSSHUB_PROXY_URI: ${{ secrets.RSSHUB_PROXY_URI }}          # 出站代理（可选）
        RSSHUB_CACHE_EXPIRE: ${{ secrets.RSSHUB_CACHE_EXPIRE }}    # 缓存时间（可选）
      run: |
        # 记录应用是否已存在：失败时只清理新建的应用，避免误删正在使用的旧应用
        if cf app "${{ env.APP_NAME }}" >/dev/null 2>&1; then EXISTED=1; else EXISTED=0; fi

        set +e   # 允许命令失败，由下面统一处理

        # 推送镜像，--no-start 表示先不启动，等环境变量设好再启动
        cf push "${{ env.APP_NAME }}" \
          --docker-image "${{ env.DOCKER_IMAGE }}" \
          -m "${{ env.MEMORY }}" -k "${{ env.DISK }}" \
          --health-check-type port -t 180 --no-start
        RC=$?

        if [ $RC -eq 0 ]; then
          # 生产模式
          cf set-env "${{ env.APP_NAME }}" NODE_ENV production
          # 内存缓存：不依赖外部服务，重启后缓存清空不影响使用
          cf set-env "${{ env.APP_NAME }}" CACHE_TYPE memory
          # 路由缓存时间（秒），调长可以减少对源站的请求；未配置则用 1800
          cf set-env "${{ env.APP_NAME }}" CACHE_EXPIRE "${RSSHUB_CACHE_EXPIRE:-1800}"
          # 访问密钥：开启后所有路由都需要带 ?key=密钥 才能访问
          cf set-env "${{ env.APP_NAME }}" ACCESS_KEY "$RSSHUB_ACCESS_KEY"
          # 如果配置了出站代理，则传给应用
          if [ -n "$RSSHUB_PROXY_URI" ]; then
            cf set-env "${{ env.APP_NAME }}" PROXY_URI "$RSSHUB_PROXY_URI"
          fi

          # 启动应用
          cf start "${{ env.APP_NAME }}"
          RC=$?
        fi

        # 失败处理：打印日志，必要时清理残留
        if [ $RC -ne 0 ]; then
          echo "❌ 部署失败，最近日志："
          cf logs "${{ env.APP_NAME }}" --recent || true
          if [ "$EXISTED" -eq 0 ]; then
            cf delete "${{ env.APP_NAME }}" -r -f
            echo "已清理失败部署残留"
          fi
          echo "可能是资源不足或镜像拉取失败，请根据上面的日志排查"
          exit 1
        fi
        echo "✅ 部署成功"

    # ---------- 步骤7：验证服务是否正常响应 ----------
    # 开启 ACCESS_KEY 后 /healthz 也需要带密钥，所以请求时附上 ?key=
    - name: Verify deployment
      env:
        RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
      run: |
        # 获取应用访问地址
        ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
        echo "ROUTE=$ROUTE" >> $GITHUB_ENV

        # 最多检查 6 次，每次间隔 10 秒，/healthz 返回 200 视为正常
        for i in 1 2 3 4 5 6; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://$ROUTE/healthz?key=$RSSHUB_ACCESS_KEY" || true)
          echo "第 $i 次检查 /healthz -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then OK=1; break; fi
          sleep 10
        done

        if [ -z "$OK" ]; then
          echo "⚠️ 接口未正常响应，查看日志："
          cf logs ${{ env.APP_NAME }} --recent
          exit 1
        fi

    # ---------- 步骤8：输出部署信息 ----------
    - name: 详细部署信息
      run: |
        echo "🚀 部署完成"
        echo "区域: ${{ github.event.inputs.region }}"
        echo "组织: ${{ env.ORG }}  空间: ${{ env.SPACE }}"
        echo "应用名称: ${{ env.APP_NAME }}"
        echo "实例地址: https://${{ env.ROUTE }}"
        echo "订阅地址格式: https://${{ env.ROUTE }}/路由?key=你的RSSHUB_ACCESS_KEY"
        echo "路由列表见官方文档: https://docs.rsshub.app/routes/"
