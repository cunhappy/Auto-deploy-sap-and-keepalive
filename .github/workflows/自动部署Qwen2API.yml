name: 自动部署Qwen2API到SAP

on:
  workflow_dispatch:
    inputs:
      region:
        description: '选择部署区域'
        required: true
        default: 'SG(free)'
        type: choice
        options:
          - SG(free)
          - US(free)
          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)
          - AWS-AU(Sydney)
          - AWS-BR(São Paulo)
          - AWS-KR(Seoul)
          - AWS-CA(Montreal)
          - AWS-US(VA)
          - AWS-US(OR)
          - AWS-EU(Frankfurt)
          - AWS-JP(Tokyo)
          - AWS-SG(Singapore)
          - GCP-AU(Sydney)
          - GCP-BR(São Paulo)
          - GCP-US(IA)
          - GCP-EU(Frankfurt)
          - GCP-JP(Osaka)
          - GCP-JP(Tokyo)
          - GCP-IL(Tel Aviv)
          - GCP-IN(Mumbai)
          - GCP-KSA(Dammam)
          - Azure-AU(Sydney)
          - Azure-BR(São Paulo)
          - Azure-CA(Montreal)
          - Azure-US(VA)
          - Azure-US(WA)
          - Azure-EU(Netherlands)
          - Azure-JP(Tokyo)
          - Azure-SG(Singapore)
          - Neo-UAE(Dubai)
          - Neo-KSA(Riyadh)
      app_name:
        description: '应用名称（强烈建议固定填写，这样每次部署地址不变）'
        required: false
        default: ''

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'rfym21/qwen2api:latest' }}
  MEMORY: ${{ secrets.MEMORY || '1G' }}
  DISK: ${{ secrets.DISK || '1G' }}

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
        echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    - name: Determine CF API endpoint and app name
      run: |
        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

        case "${{ github.event.inputs.region }}" in
          "SG(free)")               API=ap21;     P=qwen-freesg ;;
          "US(free)")               API=us10-001; P=qwen-freeus ;;
          "SAP-UAE(Dubai)")         API=ae01;     P=qwen-sapae ;;
          "SAP-AU(Sydney)")         API=ap01;     P=qwen-sapau ;;
          "SAP-US(Sterling)")       API=us01;     P=qwen-sapus1 ;;
          "SAP-US-West(Colorado)")  API=us02;     P=qwen-sapus2 ;;
          "SAP-JP(Tokyo)")          API=jp01;     P=qwen-sapjp ;;
          "AWS-AU(Sydney)")         API=ap10;     P=qwen-awsau ;;
          "AWS-BR(São Paulo)")      API=br10;     P=qwen-awsbr ;;
          "AWS-KR(Seoul)")          API=ap12;     P=qwen-awskr ;;
          "AWS-CA(Montreal)")       API=ca10;     P=qwen-awsca ;;
          "AWS-US(VA)")             API=us10-001; P=qwen-awsusva ;;
          "AWS-US(OR)")             API=us11;     P=qwen-awsusor ;;
          "AWS-EU(Frankfurt)")      API=eu10-005; P=qwen-awseu ;;
          "AWS-JP(Tokyo)")          API=jp10;     P=qwen-awsjp ;;
          "AWS-SG(Singapore)")      API=ap11;     P=qwen-awssg ;;
          "GCP-AU(Sydney)")         API=ap30;     P=qwen-gcpau ;;
          "GCP-BR(São Paulo)")      API=br30;     P=qwen-gcpbr ;;
          "GCP-US(IA)")             API=us30;     P=qwen-gcpus ;;
          "GCP-EU(Frankfurt)")      API=eu30;     P=qwen-gcpeu ;;
          "GCP-JP(Osaka)")          API=jp30;     P=qwen-gcpjpo ;;
          "GCP-JP(Tokyo)")          API=jp31;     P=qwen-gcpjpt ;;
          "GCP-IL(Tel Aviv)")       API=il30;     P=qwen-gcpil ;;
          "GCP-IN(Mumbai)")         API=in30;     P=qwen-gcpin ;;
          "GCP-KSA(Dammam)")        API=sa31;     P=qwen-gcpsa ;;
          "Azure-AU(Sydney)")       API=ap20;     P=qwen-azau ;;
          "Azure-BR(São Paulo)")    API=br20;     P=qwen-azbr ;;
          "Azure-CA(Montreal)")     API=ca20;     P=qwen-azca ;;
          "Azure-US(VA)")           API=us21;     P=qwen-azva ;;
          "Azure-US(WA)")           API=us20;     P=qwen-azwa ;;
          "Azure-EU(Netherlands)")  API=eu20-001; P=qwen-azeu ;;
          "Azure-JP(Tokyo)")        API=jp20;     P=qwen-azjp ;;
          "Azure-SG(Singapore)")    API=ap21;     P=qwen-azsg ;;
          "Neo-UAE(Dubai)")         API=neo-ae1;  P=qwen-neouae ;;
          "Neo-KSA(Riyadh)")        API=neo-sa1;  P=qwen-neoksa ;;
          *) echo "未知区域"; exit 1 ;;
        esac

        echo "CF_API=https://api.cf.${API}.hana.ondemand.com" >> $GITHUB_ENV
        APP_NAME="${P}${RANDOM_STR}"
        if [ -n "${{ github.event.inputs.app_name }}" ]; then
          APP_NAME="${{ github.event.inputs.app_name }}"
        fi
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "应用名称: $APP_NAME"

    - name: Detect container port
      run: |
        docker pull "${{ env.DOCKER_IMAGE }}"
        PORT=$(docker image inspect "${{ env.DOCKER_IMAGE }}" \
          --format '{{range $p,$_ := .Config.ExposedPorts}}{{println $p}}{{end}}' \
          | head -1 | cut -d/ -f1)
        PORT=${PORT:-8080}
        echo "镜像暴露端口: $PORT"
        echo "APP_PORT=$PORT" >> $GITHUB_ENV

    - name: Login to Cloud Foundry
      run: |
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"
        ORG=$(cf orgs | sed -n '4p')
        echo "ORG=$ORG" >> $GITHUB_ENV
        SPACE=$(cf spaces | sed -n '4p')
        echo "SPACE=$SPACE" >> $GITHUB_ENV
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

    - name: Deploy application
      env:
        QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        REDIS_URL: ${{ secrets.REDIS_URL }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: |
        if [ -z "$QWEN_API_KEY" ] || [ -z "$REDIS_URL" ]; then
          echo "❌ 缺少 QWEN_API_KEY 或 REDIS_URL，请先配置 Secrets"
          exit 1
        fi

        # 记录应用是否已存在，失败时只清理新建的应用，避免误删正在使用的旧应用
        if cf app "${{ env.APP_NAME }}" >/dev/null 2>&1; then EXISTED=1; else EXISTED=0; fi

        set +e
        cf push "${{ env.APP_NAME }}" \
          --docker-image "${{ env.DOCKER_IMAGE }}" \
          -m "${{ env.MEMORY }}" -k "${{ env.DISK }}" \
          --health-check-type port -t 180 --no-start
        RC=$?

        if [ $RC -eq 0 ]; then
          cf set-env "${{ env.APP_NAME }}" LISTEN_ADDRESS 0.0.0.0
          cf set-env "${{ env.APP_NAME }}" SERVICE_PORT "${{ env.APP_PORT }}"
          cf set-env "${{ env.APP_NAME }}" API_KEY "$QWEN_API_KEY"
          cf set-env "${{ env.APP_NAME }}" DATA_SAVE_MODE redis
          cf set-env "${{ env.APP_NAME }}" REDIS_URL "$REDIS_URL"
          cf set-env "${{ env.APP_NAME }}" CACHE_MODE default
          cf set-env "${{ env.APP_NAME }}" PM2_INSTANCES 1
          if [ -n "$PROXY_URL" ]; then
            cf set-env "${{ env.APP_NAME }}" PROXY_URL "$PROXY_URL"
          fi
          cf start "${{ env.APP_NAME }}"
          RC=$?
        fi

        if [ $RC -ne 0 ]; then
          echo "❌ 部署失败，最近日志："
          cf logs "${{ env.APP_NAME }}" --recent || true
          if [ "$EXISTED" -eq 0 ]; then
            cf delete "${{ env.APP_NAME }}" -r -f
            echo "已清理失败部署残留"
          fi
          echo "可能是资源不足，可稍后再试"
          exit 1
        fi
        echo "✅ 部署成功"

    - name: Verify deployment
      run: |
        ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
        echo "ROUTE=$ROUTE" >> $GITHUB_ENV
        for i in 1 2 3 4 5 6; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$ROUTE/models" || true)
          echo "第 $i 次检查 /models -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then OK=1; break; fi
          sleep 10
        done
        if [ -z "$OK" ]; then
          echo "⚠️ 接口未正常响应，查看日志："
          cf logs ${{ env.APP_NAME }} --recent
          exit 1
        fi

    - name: 详细部署信息
      run: |
        echo "🚀 部署完成"
        echo "区域: ${{ github.event.inputs.region }}"
        echo "组织: ${{ env.ORG }}  空间: ${{ env.SPACE }}"
        echo "应用名称: ${{ env.APP_NAME }}"
        echo "管理面板: https://${{ env.ROUTE }}"
        echo "API 地址: https://${{ env.ROUTE }}/v1"
        echo "CF_API=${{ env.CF_API }}（保活任务需要）"
