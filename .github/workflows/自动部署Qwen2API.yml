# ============================================================
# 工作流名称：自动部署 Qwen2API 到 SAP BTP (Cloud Foundry)
# 触发方式：仅手动触发（Actions 页面点 Run workflow）
# 可选区域：SG(free) 新加坡 / US(free) 美国
#
# ------------------------------------------------------------
# 运行前，必须在仓库 Settings → Secrets and variables → Actions
# → Secrets 中配置以下变量（名字必须一字不差）：
#
#   【Qwen 相关，2 个必填】
#   1) QWEN_API_KEY    管理员密钥，自己编一个足够长的随机串，如 sk-xxxxxxxx
#                      用于登录管理面板和调用 API
#   2) QWEN_REDIS_URL  Upstash Redis 的 TLS 连接串，rediss:// 开头（两个 s）
#                      如 rediss://default:密码@xxx.upstash.io:6379
#                      用于保存账号数据，解决应用重启后数据丢失
#
#   【SAP 登录，2 个必填】
#   3) EMAIL           SAP BTP 账号邮箱
#   4) PASSWORD        SAP BTP 账号密码
#
#   【可选】
#   - PROXY_URL        出站代理（Qwen 拦截 SAP 机房 IP 时使用）
#   - DOCKER_IMAGE     自定义镜像，默认 rfym21/qwen2api:latest
#   - MEMORY / DISK    内存与磁盘，默认均为 1G
# ============================================================
name: 自动部署Qwen2API到SAP

on:
  workflow_dispatch:
    inputs:
      # ---------- 部署区域选择 ----------
      region:
        description: '选择部署区域'
        required: true
        default: 'SG(free)'
        type: choice
        options:
          - SG(free)    # Azure 新加坡
          - US(free)    # AWS 美国
      # ---------- 应用名称 ----------
      app_name:
        description: '应用名称（强烈建议固定填写，这样每次部署地址不变）'
        required: false
        default: ''

# ---------- 全局环境变量（可用同名 Secret 覆盖） ----------
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'rfym21/qwen2api:latest' }}  # Docker 镜像地址
  MEMORY: ${{ secrets.MEMORY || '256M' }}                                  # 应用内存
  DISK: ${{ secrets.DISK || '256M' }}                                      # 应用磁盘

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
    # ---------- 步骤1：安装 Cloud Foundry 命令行工具 ----------
    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
        echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    # ---------- 步骤2：根据所选区域确定 API 地址和应用名 ----------
    - name: Determine CF API endpoint and app name
      run: |
        # 生成 6 位随机字母，用于自动生成应用名
        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

        # API = 区域代码（拼成 api.cf.<API>.hana.ondemand.com）
        # P   = 应用名前缀
        case "${{ github.event.inputs.region }}" in
          "SG(free)")  API=ap21;     P=qwen-freesg ;;
          "US(free)")  API=us10-001; P=qwen-freeus ;;
          *) echo "未知区域"; exit 1 ;;
        esac

        echo "CF_API=https://api.cf.${API}.hana.ondemand.com" >> $GITHUB_ENV

        # 默认用"前缀+随机串"；如果手动填写了应用名，则以填写的为准
        APP_NAME="${P}${RANDOM_STR}"
        if [ -n "${{ github.event.inputs.app_name }}" ]; then
          APP_NAME="${{ github.event.inputs.app_name }}"
        fi
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "应用名称: $APP_NAME"

    # ---------- 步骤3：检测镜像暴露的端口 ----------
    # CF 会按镜像 EXPOSE 的端口转发流量（没有声明则默认 8080），
    # 所以应用监听端口必须与它一致，这里自动读取
    - name: Detect container port
      run: |
        docker pull "${{ env.DOCKER_IMAGE }}"
        PORT=$(docker image inspect "${{ env.DOCKER_IMAGE }}" \
          --format '{{range $p,$_ := .Config.ExposedPorts}}{{println $p}}{{end}}' \
          | head -1 | cut -d/ -f1)
        PORT=${PORT:-8080}
        echo "镜像暴露端口: $PORT"
        echo "APP_PORT=$PORT" >> $GITHUB_ENV

    # ---------- 步骤4：登录 Cloud Foundry ----------
    - name: Login to Cloud Foundry
      run: |
        # 第一次登录，用于获取组织和空间列表
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"

        # 取第一个组织和空间
        ORG=$(cf orgs | sed -n '4p')
        echo "ORG=$ORG" >> $GITHUB_ENV
        SPACE=$(cf spaces | sed -n '4p')
        echo "SPACE=$SPACE" >> $GITHUB_ENV

        # 指定组织和空间重新登录
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

    # ---------- 步骤5：部署应用 ----------
    - name: Deploy application
      env:
        # 左边是脚本里使用的名字，右边是 GitHub Secrets 里的名字
        QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}        # 管理员密钥（必填）
        QWEN_REDIS_URL: ${{ secrets.QWEN_REDIS_URL }}    # Upstash Redis 地址（必填，rediss:// 开头）
        PROXY_URL: ${{ secrets.PROXY_URL }}              # 出站代理（可选）
      run: |
        # 必填项检查
        if [ -z "$QWEN_API_KEY" ] || [ -z "$QWEN_REDIS_URL" ]; then
          echo "❌ 缺少 QWEN_API_KEY 或 QWEN_REDIS_URL，请先在仓库 Secrets 中配置"
          exit 1
        fi

        # 记录应用是否已存在：失败时只清理新建的应用，避免误删正在使用的旧应用
        if cf app "${{ env.APP_NAME }}" >/dev/null 2>&1; then EXISTED=1; else EXISTED=0; fi

        set +e   # 允许命令失败，由下面统一处理

        # 推送镜像，--no-start 表示先不启动，等环境变量设好再启动
        cf push "${{ env.APP_NAME }}" \
          --docker-image "${{ env.DOCKER_IMAGE }}" \
          -m "${{ env.MEMORY }}" -k "${{ env.DISK }}" \
          --health-check-type port -t 180 --no-start
        RC=$?

        if [ $RC -eq 0 ]; then
          # 监听所有网卡，否则 CF 路由进不来
          cf set-env "${{ env.APP_NAME }}" LISTEN_ADDRESS 0.0.0.0
          # 服务端口，与上一步检测到的镜像端口一致
          cf set-env "${{ env.APP_NAME }}" SERVICE_PORT "${{ env.APP_PORT }}"
          # 管理员 API 密钥（第一个密钥即管理员）
          cf set-env "${{ env.APP_NAME }}" API_KEY "$QWEN_API_KEY"
          # 数据保存到 Redis，解决重启后数据丢失
          cf set-env "${{ env.APP_NAME }}" DATA_SAVE_MODE redis
          # 注意：应用内的变量名必须仍是 REDIS_URL（程序只认这个名字），
          # 值取自 GitHub Secret 里的 QWEN_REDIS_URL
          cf set-env "${{ env.APP_NAME }}" REDIS_URL "$QWEN_REDIS_URL"
          # 图片缓存使用内存模式
          cf set-env "${{ env.APP_NAME }}" CACHE_MODE default
          # 单进程运行，节省内存
          cf set-env "${{ env.APP_NAME }}" PM2_INSTANCES 1
          # 如果配置了代理，则传给应用
          if [ -n "$PROXY_URL" ]; then
            cf set-env "${{ env.APP_NAME }}" PROXY_URL "$PROXY_URL"
          fi

          # 启动应用
          cf start "${{ env.APP_NAME }}"
          RC=$?
        fi

        # 失败处理：打印日志，必要时清理残留
        if [ $RC -ne 0 ]; then
          echo "❌ 部署失败，最近日志："
          cf logs "${{ env.APP_NAME }}" --recent || true
          if [ "$EXISTED" -eq 0 ]; then
            cf delete "${{ env.APP_NAME }}" -r -f
            echo "已清理失败部署残留"
          fi
          echo "可能是资源不足，可稍后再试"
          exit 1
        fi
        echo "✅ 部署成功"

    # ---------- 步骤6：验证服务是否正常响应 ----------
    - name: Verify deployment
      run: |
        # 获取应用访问地址
        ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
        echo "ROUTE=$ROUTE" >> $GITHUB_ENV

        # 最多检查 6 次，每次间隔 10 秒，/models 返回 200 视为正常
        for i in 1 2 3 4 5 6; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$ROUTE/models" || true)
          echo "第 $i 次检查 /models -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then OK=1; break; fi
          sleep 10
        done

        if [ -z "$OK" ]; then
          echo "⚠️ 接口未正常响应，查看日志："
          cf logs ${{ env.APP_NAME }} --recent
          exit 1
        fi

    # ---------- 步骤7：输出部署信息 ----------
    - name: 详细部署信息
      run: |
        echo "🚀 部署完成"
        echo "区域: ${{ github.event.inputs.region }}"
        echo "组织: ${{ env.ORG }}  空间: ${{ env.SPACE }}"
        echo "应用名称: ${{ env.APP_NAME }}"
        echo "管理面板: https://${{ env.ROUTE }}"
        echo "API 地址: https://${{ env.ROUTE }}/v1"
        echo "保活任务需要的变量 CF_API = ${{ env.CF_API }}"
        echo "保活任务需要的变量 APP_NAME = ${{ env.APP_NAME }}"
