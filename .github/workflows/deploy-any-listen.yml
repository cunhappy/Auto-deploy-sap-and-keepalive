# ============================================================
# 工作流名称：自动部署 any-listen（网页版）到 SAP BTP (Cloud Foundry)
# 触发方式：仅手动触发（Actions 页面点 Run workflow）
# 可选区域：SG(free) 新加坡 / US(free) 美国
#
# ------------------------------------------------------------
# 运行前，必须在仓库 Settings → Secrets and variables → Actions
# → Secrets 中配置以下变量（名字必须一字不差）：
#
#   【any-listen 相关】
#   1) ANYLISTEN_LOGIN_PWD        必填。网页登录密码（对应应用的 LOGIN_PWD）
#   2) ANYLISTEN_WEBDAV_SERVERS   可选。WebDAV 自动配置（对应应用的 WEBDAV_SERVERS）
#                                 每行一个服务器，字段用英文逗号分隔：
#                                 url, username, password[, directory[, listName[, includeSubDir]]]
#                                 例：https://dav.example.com, user1, pass1, /music, 我的音乐, true
#                                 填 4 个及以上字段才会自动创建远程列表
#                                 密码里有英文逗号时写成 \,
#
#   【SAP 登录，2 个必填】
#   3) EMAIL                      SAP BTP 账号邮箱
#   4) PASSWORD                   SAP BTP 账号密码
#
#   【可选】
#   - ANYLISTEN_DOCKER_IMAGE      自定义镜像，默认 ghcr.io/tushus/any-listen:latest
#   - ANYLISTEN_MEMORY / ANYLISTEN_DISK   内存与磁盘，默认 512M / 1G
#
# 说明：应用的数据目录（/server/data）在 SAP 上是临时的，每次重启都会清空。
#       WEBDAV_SERVERS 会在每次启动时自动重建 WebDAV 服务器和远程列表，
#       但在网页里手动创建的本地内容（如手动建的歌单）重启后会丢失。
# ============================================================
name: 自动部署any-listen到SAP

on:
  workflow_dispatch:
    inputs:
      # ---------- 部署区域选择 ----------
      region:
        description: '选择部署区域'
        required: true
        default: 'SG(free)'
        type: choice
        options:
          - SG(free)    # Azure 新加坡
          - US(free)    # AWS 美国
      # ---------- 应用名称 ----------
      app_name:
        description: '应用名称（建议固定填写，否则每次部署地址都会变）'
        required: false
        default: 'myanylistenfree'

# ---------- 全局环境变量（可用同名 Secret 覆盖） ----------
env:
  DOCKER_IMAGE: ${{ secrets.ANYLISTEN_DOCKER_IMAGE || 'ghcr.io/tushus/any-listen:latest' }}  # Docker 镜像地址
  MEMORY: ${{ secrets.ANYLISTEN_MEMORY || '256M' }}                                         # 应用内存
  DISK: ${{ secrets.ANYLISTEN_DISK || '512M' }}                                               # 应用磁盘

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
    # ---------- 步骤1：安装 Cloud Foundry 命令行工具 ----------
    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
        echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    # ---------- 步骤2：根据所选区域确定 API 地址和应用名 ----------
    - name: Determine CF API endpoint and app name
      run: |
        # 生成 6 位随机字母，用于自动生成应用名
        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

        # API = 区域代码（拼成 api.cf.<API>.hana.ondemand.com）
        # P   = 应用名前缀
        case "${{ github.event.inputs.region }}" in
          "SG(free)")  API=ap21;     P=listen-freesg ;;
          "US(free)")  API=us10-001; P=listen-freeus ;;
          *) echo "未知区域"; exit 1 ;;
        esac

        echo "CF_API=https://api.cf.${API}.hana.ondemand.com" >> $GITHUB_ENV

        # 默认用"前缀+随机串"；如果手动填写了应用名，则以填写的为准
        APP_NAME="${P}${RANDOM_STR}"
        if [ -n "${{ github.event.inputs.app_name }}" ]; then
          APP_NAME="${{ github.event.inputs.app_name }}"
        fi
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "应用名称: $APP_NAME"

    # ---------- 步骤3：检查必填 Secrets ----------
    # 放在登录和部署之前：配置不全就直接失败，不会在 SAP 上留下残留
    - name: Check secrets
      env:
        ANYLISTEN_LOGIN_PWD: ${{ secrets.ANYLISTEN_LOGIN_PWD }}
        ANYLISTEN_WEBDAV_SERVERS: ${{ secrets.ANYLISTEN_WEBDAV_SERVERS }}
      run: |
        if [ -z "$ANYLISTEN_LOGIN_PWD" ]; then
          echo "❌ 缺少 ANYLISTEN_LOGIN_PWD，请先在仓库 Secrets 中配置"
          exit 1
        fi
        if [ -z "$ANYLISTEN_WEBDAV_SERVERS" ]; then
          echo "ℹ️ 未配置 ANYLISTEN_WEBDAV_SERVERS，部署后需在网页里手动添加 WebDAV（重启后会丢失）"
        else
          echo "✅ 已配置 WebDAV 自动配置"
        fi

    # ---------- 步骤4：查看镜像暴露的端口 ----------
    # 文档里服务端口是 9500，CF 会按镜像 EXPOSE 的端口转发流量
    # （没有声明则默认 8080），所以这里打印出来方便排查
    - name: Detect container port
      run: |
        docker pull "${{ env.DOCKER_IMAGE }}"
        PORT=$(docker image inspect "${{ env.DOCKER_IMAGE }}" \
          --format '{{range $p,$_ := .Config.ExposedPorts}}{{println $p}}{{end}}' \
          | head -1 | cut -d/ -f1)
        if [ -z "$PORT" ]; then
          echo "⚠️ 镜像未声明 EXPOSE，CF 将默认转发到 8080，"
          echo "   而文档中应用监听 9500，可能导致健康检查失败，请留意部署日志"
        else
          echo "镜像暴露端口: $PORT"
        fi

    # ---------- 步骤5：登录 Cloud Foundry ----------
    - name: Login to Cloud Foundry
      run: |
        # 第一次登录，用于获取组织和空间列表
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"

        # 取第一个组织和空间
        ORG=$(cf orgs | sed -n '4p')
        echo "ORG=$ORG" >> $GITHUB_ENV
        SPACE=$(cf spaces | sed -n '4p')
        echo "SPACE=$SPACE" >> $GITHUB_ENV

        # 指定组织和空间重新登录
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

    # ---------- 步骤6：部署应用 ----------
    - name: Deploy application
      env:
        ANYLISTEN_LOGIN_PWD: ${{ secrets.ANYLISTEN_LOGIN_PWD }}
        ANYLISTEN_WEBDAV_SERVERS: ${{ secrets.ANYLISTEN_WEBDAV_SERVERS }}
      run: |
        # 记录应用是否已存在：失败时只清理新建的应用，避免误删正在使用的旧应用
        if cf app "${{ env.APP_NAME }}" >/dev/null 2>&1; then EXISTED=1; else EXISTED=0; fi

        set +e   # 允许命令失败，由下面统一处理

        # 推送镜像，--no-start 表示先不启动，等环境变量设好再启动
        cf push "${{ env.APP_NAME }}" \
          --docker-image "${{ env.DOCKER_IMAGE }}" \
          -m "${{ env.MEMORY }}" -k "${{ env.DISK }}" \
          --health-check-type port -t 180 --no-start
        RC=$?

        if [ $RC -eq 0 ]; then
          # 网页登录密码
          cf set-env "${{ env.APP_NAME }}" LOGIN_PWD "$ANYLISTEN_LOGIN_PWD"

          # WebDAV 自动配置：每次启动都会重建服务器和远程列表
          # 多行内容原样传入，应用内变量名必须是 WEBDAV_SERVERS
          if [ -n "$ANYLISTEN_WEBDAV_SERVERS" ]; then
            cf set-env "${{ env.APP_NAME }}" WEBDAV_SERVERS "$ANYLISTEN_WEBDAV_SERVERS"
          fi

          # 用 restart 而不是 start：应用已存在且在运行时，restart 才会让新配置和新镜像生效
          cf restart "${{ env.APP_NAME }}"
          RC=$?
        fi

        # 失败处理：打印日志，必要时清理残留
        if [ $RC -ne 0 ]; then
          echo "❌ 部署失败，最近日志："
          cf logs "${{ env.APP_NAME }}" --recent || true
          if [ "$EXISTED" -eq 0 ]; then
            cf delete "${{ env.APP_NAME }}" -r -f
            echo "已清理失败部署残留"
          fi
          echo "可能是资源不足、镜像拉取失败或端口不匹配，请根据上面的日志排查"
          exit 1
        fi
        echo "✅ 部署成功"

    # ---------- 步骤7：验证服务是否正常响应 ----------
    - name: Verify deployment
      env:
        ANYLISTEN_WEBDAV_SERVERS: ${{ secrets.ANYLISTEN_WEBDAV_SERVERS }}
      run: |
        # 获取应用访问地址
        ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
        echo "ROUTE=$ROUTE" >> $GITHUB_ENV

        # 最多检查 6 次，每次间隔 10 秒，首页返回 200/301/302/401 视为服务已响应
        for i in 1 2 3 4 5 6; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$ROUTE/" || true)
          echo "第 $i 次检查 / -> HTTP $CODE"
          case "$CODE" in 200|301|302|401) OK=1; break ;; esac
          sleep 10
        done

        if [ -z "$OK" ]; then
          echo "⚠️ 服务未正常响应，查看日志："
          cf logs ${{ env.APP_NAME }} --recent
          exit 1
        fi

        # 配置了 WebDAV 时，打印相关启动日志，确认自动配置是否生效
        if [ -n "$ANYLISTEN_WEBDAV_SERVERS" ]; then
          echo "---------- WEBDAV_SERVERS 启动日志 ----------"
          sleep 5
          cf logs ${{ env.APP_NAME }} --recent | grep "WEBDAV_SERVERS" || \
            echo "⚠️ 未找到 [WEBDAV_SERVERS] 日志：镜像可能不含该功能，或变量为空"
        fi

    # ---------- 步骤8：输出部署信息 ----------
    - name: 详细部署信息
      run: |
        echo "🚀 部署完成"
        echo "区域: ${{ github.event.inputs.region }}"
        echo "组织: ${{ env.ORG }}  空间: ${{ env.SPACE }}"
        echo "应用名称: ${{ env.APP_NAME }}"
        echo "访问地址: https://${{ env.ROUTE }}"
        echo "登录密码: 你配置的 ANYLISTEN_LOGIN_PWD"
